<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - Learning Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <p class="eyebrow">AI-POWERED LEARNING ASSISTANT</p>
            <h1>EduGenie</h1>
            <p>Ask, understand, practice, summarize, and build a learning path.</p>
        </section>

        <section class="card">
            <label for="task">Choose a task</label>
            <select id="task">
                <option value="qa">Q&amp;A</option>
                <option value="explain">Explain</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize</option>
                <option value="learn">Recommend Learning Path</option>
            </select>

            <label for="inputText">Your input</label>
            <textarea id="inputText" rows="10" placeholder="Ask a question or paste educational text..."></textarea>

            <button id="submitBtn">Generate</button>
            <p id="status" class="status"></p>
        </section>

        <section class="card result-card">
            <h2>Result</h2>
            <div id="result" class="result">Your result will appear here.</div>
        </section>
    </main>

    <script>
        const task = document.getElementById("task");
        const inputText = document.getElementById("inputText");
        const submitBtn = document.getElementById("submitBtn");
        const result = document.getElementById("result");
        const status = document.getElementById("status");

        const placeholders = {
            qa: "Example: Which is the largest ocean?",
            explain: "Example: Explain the Pythagoras theorem",
            quiz: "Paste a passage or topic for 3 MCQs...",
            summarize: "Paste a long educational paragraph...",
            learn: "Example: SQL"
        };

        task.addEventListener("change", () => {
            inputText.placeholder = placeholders[task.value];
        });

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderQuiz(data) {
            if (data.error) return `<p class="error">${escapeHtml(data.error)}</p>`;

            return data.questions.map((q, index) => `
                <article class="quiz-question">
                    <h3>${index + 1}. ${escapeHtml(q.question)}</h3>
                    <div class="options">
                        ${q.options.map((option, optionIndex) => `
                            <label class="option">
                                <input type="radio" name="q${index}" value="${escapeHtml(option)}">
                                <span>${String.fromCharCode(65 + optionIndex)}. ${escapeHtml(option)}</span>
                            </label>
                        `).join("")}
                    </div>
                    <p class="answer" data-answer="${escapeHtml(q.correct_answer)}">
                        Answer: <strong>${escapeHtml(q.correct_answer)}</strong><br>
                        ${escapeHtml(q.explanation || "")}
                    </p>
                </article>
            `).join("");
        }

        submitBtn.addEventListener("click", async () => {
            const text = inputText.value.trim();
            if (!text) {
                result.innerHTML = '<p class="error">Please enter some text first.</p>';
                return;
            }

            const endpoints = {
                qa: "/qa",
                explain: "/explain",
                quiz: "/quiz",
                summarize: "/summarize",
                learn: "/learn/recommendations"
            };

            submitBtn.disabled = true;
            status.textContent = "Generating...";
            result.textContent = "";

            try {
                const response = await fetch(endpoints[task.value], {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({text})
                });

                const data = await response.json();

                if (task.value === "quiz") {
                    result.innerHTML = renderQuiz(data.result);
                } else {
                    const value = data.result ?? data.detail ?? "No result returned.";
                    result.innerHTML = `<div class="formatted">${escapeHtml(value)}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            } finally {
                submitBtn.disabled = false;
                status.textContent = "";
            }
        });
    </script>
</body>
</html>
